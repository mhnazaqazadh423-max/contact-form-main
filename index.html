<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <!-- displays site properly based on user's device -->

  <link rel="icon" type="image/png" sizes="32x32" href="./assets/images/favicon-32x32.png">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <title>Frontend Mentor | Contact form</title>

  <!-- Feel free to remove these styles or customise in your own stylesheet 👍 -->
  <style>
    .attribution {
      font-size: 0.6875rem;
      text-align: center;
    }

    .attribution a {
      color: hsl(228, 45%, 44%);
    }

    @font-face {
      font-family: "karla";
      src: url("Karla-Regular.ttf");
    }

    body {
      background-color: hsl(148, 38%, 91%);
      font-family: karla;
      justify-content: center;
      align-items: center;
      min-height: 100vh;



    }

    .form {

      background-color: hsl(0, 0%, 100%);
      border-radius: 15px;
      max-width: 660px;
      margin: 120px auto;
      display: flex;
      flex-direction: column;
      gap: 12px;
      padding: 40px;
    }

    .btn {
      background-color: hsl(169, 82%, 27%);
      color: white;
    }

    .btn:hover {
      background-color: hsl(187, 24%, 22%);
      color: white;
    }

    .req {
      color: hsl(169, 82%, 27%);
    }

    .radio-box:has(input:checked) {
      background-color: hsl(148, 38%, 91%);
      border-color: hsl(169, 82%, 27%) !important;
    }

    input {
      accent-color: hsl(169, 82%, 27%);
    }

    .radio-box,
    input[type="radio"],
    input[type="checkbox"],
    label,
    .btn {
      cursor: pointer;
    }

    .form-control:hover,
    .form-control:focus {
      border-color: hsl(169, 82%, 27%);
      box-shadow: none;
    }
    .success-box {
  background-color: hsl(187, 24%, 22%);
  color: white;
  border-radius: 12px;
  text-align: center;
  padding: 20px;
  max-width: 450px;
  margin: 0 auto;
  top: 12px;
  position: absolute;
  left: 12px;
  right: 12px;
  border-radius: 15px;
  text-align: left;
}


.form-control.is-invalid{
  background-image: none;
}
@media (max-width: 576px) {
  .form {
    padding: 24px;
  }
}
input:-webkit-autofill {
  -webkit-box-shadow: 0 0 0 1000px white inset;
}
  </style>
</head>

<body>

     <div  id="akh" class="success-box d-none">
     <h5><img src="icon-success-check.svg" alt=""> Message Sent!</h5>
     <p>Thanks for completing the form. We'll be in touch soon!</p>
     </div>
  <div class="container">

    <div class="">

      <form id="myform" novalidate action="#" onsubmit="return javaf() " class="form container">
        <h1 class="fs-2">Contact Us</h1>

        <div class="row">
          <div class="col-md-6">
            <label for="fname"> First Name <span class="req">*</span></label>
            <input type="text" class="form-control" id="fname" name="user">
            <span id="Fname" class="text-danger"></span>
          </div>
          <div class="col-md-6">
            <label for="lname"> Last Name <span class="req">*</span></label>
            <input type="text" class="form-control" id="lname" name="lastname">
            <span id="Lastname" class="text-danger"></span>
          </div>
        </div>

        <div>
          <label for="email">Email Address <span class="req">*</span></label>
          <input type="email" class="form-control" id="email" name="email">
          <span id="Email" class="text-danger"></span>
        </div>
        <div>
          <label>Query Type <span class="req">*</span></label>
          <div class="row">
            <div class="col-md-6">
              <div class="border rounded p-2 radio-box">
                <input type="radio" id="radio" name="radi" value="General Enquiry">
                <label for="radio">General Enquiry</label>
              </div>
            </div>
            <div class="col-md-6">
              <div class="border rounded p-2 radio-box">
                <input type="radio" id="radi" name="radi" value="Support Request">
                <label for="radi">Support Request</label>
              </div>
            </div>
          </div>
          <span id="Query" class="text-danger"></span>
        </div>
        <div>
          <label for="message">Message <span class="req">*</span></label>
          <textarea name="message" id="message" class="form-control"></textarea>
          <span id="Chat" class="text-danger"></span>
        </div>
        <div class="mb-3">
          <input type="checkbox" id="tik" name="consent">
          <label for="tik">I consent to being contacted by the team <span class="req">*</span></label>
          <span id="Consent" class="text-danger d-block"></span>
        </div>
        <button type="submit" class="btn w-100 btn ">Submit</button>
      </form>
    </div>
  </div>


  <script>
    
    function javaf(){
    var fname =document.getElementById("fname").value.trim();
    var lname =document.getElementById("lname").value.trim();
    var email =document.getElementById("email").value.trim();
    var mes=document.getElementById("message").value.trim();
    var tik=document.getElementById("tik").checked;
    var tik1=document.getElementById("radio").checked;
    var tik2=document.getElementById("radi").checked;     
    var boolean = true;
    document.getElementById("Fname").innerHTML="";
    document.getElementById("Lastname").innerHTML="";
    document.getElementById("Email").innerHTML="";
    document.getElementById("Chat").innerHTML="";
    document.getElementById("Consent").innerHTML="";
    document.getElementById("Query").innerHTML="";
    document.getElementById("fname").classList.remove("is-invalid");
    document.getElementById("lname").classList.remove("is-invalid");
    document.getElementById("email").classList.remove("is-invalid");
    document.getElementById("message").classList.remove("is-invalid");


       if (fname ===""){
        document.getElementById("Fname").innerHTML=
        "This field is required"
        document.getElementById("fname").classList.add("is-invalid");
       boolean = false;
       }
             if (lname ===""){
        document.getElementById("Lastname").innerHTML=
        "This field is required"
         document.getElementById("lname").classList.add("is-invalid");
       boolean = false;
       }
        if (email ===""){
        document.getElementById("Email").innerHTML=
        "This field is required"
         document.getElementById("email").classList.add("is-invalid");
       boolean = false;
       } else if (email.indexOf("@")===-1){
         document.getElementById("Email").innerHTML=
         "Please enter a valid email address"
         document.getElementById("email").classList.add("is-invalid");
        boolean = false;
       }
       if (mes ===""){
        document.getElementById("Chat").innerHTML=
        "This field is required"
         document.getElementById("message").classList.add("is-invalid");
        boolean = false;
       }
       if (tik===false){
        document.getElementById("Consent").innerHTML=
        "To submit this form, please consent to being contacted"
       boolean = false;
       }
       if(tik1===false && tik2===false){
        document.getElementById("Query").innerHTML=
        "Please select a query type"
       boolean = false;
       }
       if (boolean===true){
       document.getElementById("akh").classList.remove("d-none");
       document.getElementById("myform").reset();
       setTimeout(function(){
  document.getElementById("akh").classList.add("d-none");
}, 4000);
       }
       return false;
       
    }





  </script>



  
  <footer class="attribution">
    Challenge by <a href="https://www.frontendmentor.io?ref=challenge">Frontend Mentor</a>. 
    Coded by <a href="#">MahnazAqazadh</a>
  </footer> 
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>

</html>
